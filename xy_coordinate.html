<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>座標空間實驗室 - 專業教具版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 95%; max-width: 1000px; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        
        .control-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .line-card { padding: 15px; border-radius: 12px; border: 1px solid #eee; background: #fff; }
        .line-card.disabled { opacity: 0.4; }
        
        .line-1 { border-top: 6px solid #ff6384; }
        .line-2 { border-top: 6px solid #36a2eb; }
        .line-3 { border-top: 6px solid #4bc0c0; }

        .input-row { display: flex; align-items: center; gap: 5px; font-size: 1.1rem; justify-content: center; margin-bottom: 10px; }
        input[type="number"] { width: 50px; padding: 5px; border: 2px solid #ddd; border-radius: 6px; text-align: center; }
        
        .step-config { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px dashed #ccc; }
        .step-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; margin-bottom: 5px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { 
            padding: 8px 4px; font-size: 0.85rem; cursor: pointer; border: 1px solid #ccc; 
            border-radius: 5px; background: #fdfdfd; user-select: none; /* 防止長按選中文字 */
        }
        button:hover { background: #e0eefd; }
        button:active { background: #36a2eb; color: white; }

        .chart-wrapper { position: relative; height: 500px; width: 100%; border: 1px solid #ddd; border-radius: 10px; background: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 座標空間實驗室</h1>
    
    <div class="control-panel">
        <script>
            for (let i = 1; i <= 3; i++) {
                document.write(`
                <div class="line-card line-${i}" id="card-${i}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <label><input type="checkbox" id="show-${i}" ${i<3?'checked':''} onchange="update()"> 直線 ${String.fromCharCode(64+i)}</label>
                    </div>
                    
                    <div class="input-row">
                        <input type="number" id="a${i}" value="${i===1?1:i===2?1:0}" oninput="update()">x + 
                        <input type="number" id="b${i}" value="${i===1?1:i===2?-1:1}" oninput="update()">y = 
                        <input type="number" id="c${i}" value="${i===1?10:i===2?0:-5}" oninput="update()">
                    </div>

                    <div class="step-config">
                        <div class="step-row">
                            <span>自定義增量：</span>
                            <span>ΔX: <input type="number" id="stepX${i}" value="1" style="width:35px"></span>
                            <span>ΔY: <input type="number" id="stepY${i}" value="1" style="width:35px"></span>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button onclick="swapSign(${i}, 'a')">+/- X 係數</button>
                        <button onclick="swapSign(${i}, 'b')">+/- Y 係數</button>
                        <button onmousedown="startShift(${i}, 1)" onmouseup="stopShift()" onmouseleave="stopShift()">同步增加 (長按)</button>
                        <button onmousedown="startShift(${i}, -1)" onmouseup="stopShift()" onmouseleave="stopShift()">同步減少 (長按)</button>
                    </div>
                </div>
                `);
            }
        </script>
    </div>

    <div class="chart-wrapper">
        <canvas id="mathChart"></canvas>
    </div>
</div>

<script>
    let mathChart;
    const RANGE = 20;
    let shiftInterval = null;

    function init() {
        const ctx = document.getElementById('mathChart').getContext('2d');
        mathChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    { label: '直線 A', borderColor: '#ff6384', data: [], fill: false, borderWidth: 4, pointRadius: 0 },
                    { label: '直線 B', borderColor: '#36a2eb', data: [], fill: false, borderWidth: 4, pointRadius: 0 },
                    { label: '直線 C', borderColor: '#4bc0c0', data: [], fill: false, borderWidth: 4, pointRadius: 0 }
                ]
            },
            options: {
                animation: false, // 關閉所有動畫，達成即時反應
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'center', min: -RANGE, max: RANGE, grid: { color: '#e0e0e0' }, ticks: { stepSize: 2 } },
                    y: { type: 'linear', position: 'center', min: -RANGE, max: RANGE, grid: { color: '#e0e0e0' }, ticks: { stepSize: 2 } }
                },
                plugins: { legend: { display: false } }
            }
        });
        update();
    }

    // 1 & 2. 正負交換 (無動畫，因為全局已關閉)
    function swapSign(id, target) {
        const el = document.getElementById(`${target}${id}`);
        el.value = (parseFloat(el.value) * -1) || 0;
        update();
    }

    // 3 & 4. 長按連續觸發與自定義增量
    function startShift(id, direction) {
        if (shiftInterval) return;
        
        const run = () => {
            const elA = document.getElementById(`a${id}`);
            const elB = document.getElementById(`b${id}`);
            const stepX = parseFloat(document.getElementById(`stepX${id}`).value) || 0;
            const stepY = parseFloat(document.getElementById(`stepY${id}`).value) || 0;

            // 模式：X 增加時 Y 減少，反之亦然 (依據您原先 x+1, y-1 的邏輯)
            // 如果您希望同步增減，可修改下方的正負號
            elA.value = (parseFloat(elA.value) + (stepX * direction)).toFixed(1);
            elB.value = (parseFloat(elB.value) - (stepY * direction)).toFixed(1);
            update();
        };

        run(); // 先執行一次
        shiftInterval = setInterval(run, 100); // 每 100 毫秒觸發一次
    }

    function stopShift() {
        if (shiftInterval) {
            clearInterval(shiftInterval);
            shiftInterval = null;
        }
    }

    function calculateLine(a, b, c) {
        const points = [];
        if (b !== 0) {
            points.push({ x: -RANGE, y: (c - a * (-RANGE)) / b });
            points.push({ x: RANGE, y: (c - a * RANGE) / b });
        } else if (a !== 0) {
            const xVal = c / a;
            points.push({ x: xVal, y: -RANGE });
            points.push({ x: xVal, y: RANGE });
        }
        return points;
    }

    function update() {
        for (let i = 1; i <= 3; i++) {
            const isVisible = document.getElementById(`show-${i}`).checked;
            const card = document.getElementById(`card-${i}`);
            if (isVisible) {
                card.classList.remove('disabled');
                const a = parseFloat(document.getElementById(`a${i}`).value) || 0;
                const b = parseFloat(document.getElementById(`b${i}`).value) || 0;
                const c = parseFloat(document.getElementById(`c${i}`).value) || 0;
                mathChart.data.datasets[i-1].data = calculateLine(a, b, c);
                mathChart.data.datasets[i-1].hidden = false;
            } else {
                card.classList.add('disabled');
                mathChart.data.datasets[i-1].data = [];
                mathChart.data.datasets[i-1].hidden = true;
            }
        }
        mathChart.update();
    }

    window.onload = init;
</script>

</body>
</html>
