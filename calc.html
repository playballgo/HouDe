<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>乘法與除法練習</title>
<style>
  body { font-family: monospace, monospace; padding: 10px; background: #f9f9f9; }
  label { margin-right: 10px; }
  #controls { margin-bottom: 10px; }
  #problems { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .problem {
    background: white;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
    white-space: pre-wrap;
  }
  textarea.solution {
    width: 100%;
    font-family: monospace;
    white-space: pre-wrap;
    margin-top: 4px;
    background: #eef6ff;
    border: 1px solid #99c;
    resize: none;
    overflow: visible;
    height: auto;
    min-height: 200px;
  }
  input.answer {
    width: 100%;
    font-size: 16px;
    box-sizing: border-box;
    margin-top: 6px;
    -moz-appearance: textfield;
  }
  /* Remove number input spinners for Chrome, Safari, Edge */
  input.answer::-webkit-outer-spin-button,
  input.answer::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  button { margin-top: 10px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
  #timer { font-weight: bold; margin-left: 10px; }
  #score { font-weight: bold; margin-top: 12px; font-size: 18px; }
  #mobileLayoutLabel { user-select: none; }
</style>
</head>
<body>

<h1>乘法與除法計算練習</h1>

<div id="controls">
  <label>題數(1~30):
    <input type="number" id="numQuestions" value="10" min="1" max="30" style="width: 60px;" />
  </label>
  <label>
    <input type="checkbox" id="mobileLayout" /> 手機排版(一題一行)
  </label>
  <label>
    <input type="radio" name="mode" value="mul" checked /> 乘法模式
  </label>
  <label>
    <input type="radio" name="mode" value="div" /> 除法模式
  </label>
  <button id="startBtn">開始練習</button>
  <span id="timer"></span>
</div>

<div id="problems"></div>

<button id="submitBtn" disabled>交卷</button>

<div id="score"></div>

<script>
(() => {
  const numQuestionsInput = document.getElementById('numQuestions');
  const mobileLayoutCheckbox = document.getElementById('mobileLayout');
  const problemsDiv = document.getElementById('problems');
  const startBtn = document.getElementById('startBtn');
  const submitBtn = document.getElementById('submitBtn');
  const timerSpan = document.getElementById('timer');
  const scoreDiv = document.getElementById('score');
  const modeRadios = document.getElementsByName('mode');

  let problems = [];
  let timer = null;
  let timeLeft = 0;

  const timePerQuestion = 30;

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateMulProblem() {
    // 2~3位數 × 2~3位數
    const digitsA = randInt(2,3);
    const digitsB = randInt(2,3);
    const a = randInt(10**(digitsA-1), 10**digitsA -1);
    const b = randInt(10**(digitsB-1), 10**digitsB -1);
    return {a,b,op:'×',result: a*b};
  }

  function generateDivProblem() {
    // 3~4位數 ÷ 2位數，整除，被除數最多4位數
    const divisor = randInt(10,99);
    const maxQuotient = Math.floor(9999 / divisor);
    const quotient = randInt(10, maxQuotient);
    const dividend = divisor * quotient;
    return {a: dividend, b: divisor, op:'÷', result: quotient};
  }

  function padLeft(str,len){
    return ' '.repeat(len - str.length) + str;
  }

  function showMulSolution(p) {
    const a = p.a.toString();
    const b = p.b.toString();
    const resultStr = p.result.toString();

    // 部分積(每位b乘a)
    const bDigits = b.split('').reverse();
    let partials = [];
    for(let i=0; i<bDigits.length; i++){
      const digit = parseInt(bDigits[i]);
      const partial = (p.a * digit).toString();
      partials.push(padLeft(partial + ' '.repeat(i), resultStr.length));
    }

    const width = Math.max(a.length, b.length + 1, resultStr.length);

    let lines = [];
    lines.push(padLeft(a, width));               // 被乘數
    lines.push('×' + padLeft(b, width-1));      // 乘號與乘數
    lines.push('-'.repeat(width));               // 分隔線

    for(let i=0; i<partials.length; i++){
      lines.push(partials[i]);
    }
    if (partials.length > 1){
      lines.push('-'.repeat(width));
      lines.push(padLeft(resultStr, width));
    }

    return lines.join('\n');
  }

  function showDivSolution(p){
    const dividend = p.a.toString();
    const divisor = p.b.toString();
    const quotient = p.result.toString();

    const divisorLen = divisor.length;
    const dividendLen = dividend.length;

    // 商行(放在除號上方，空白對齊除號起點)
    const spaceBefore = ' '.repeat(divisorLen + 1);
    const firstLine = spaceBefore + quotient;
    const secondLine = divisor + ')' + dividend;

    let lines = [];
    lines.push(firstLine);
    lines.push(secondLine);

    let idx = 0;
    let current = parseInt(dividend[idx]);

    // 找第一個 >= 除數的數字起點
    while(current < p.b && idx < dividend.length - 1){
      idx++;
      current = current * 10 + parseInt(dividend[idx]);
    }

    const lineLen = divisorLen + dividendLen;

    while(idx < dividend.length){
      const qDigit = Math.floor(current / p.b);
      const mult = qDigit * p.b;
      const remainder = current - mult;

      // 對齊乘回去的數字、被除數段
      const spaceCount = lineLen - (dividend.length - idx);
      const currentStr = padLeft(current.toString(), spaceCount);
      const multStr = padLeft(mult.toString(), spaceCount);
      const dashStr = padLeft('-'.repeat(mult.toString().length), spaceCount);

      lines.push(currentStr);
      lines.push(multStr);
      lines.push(dashStr);

      idx++;
      if(idx < dividend.length){
        current = remainder * 10 + parseInt(dividend[idx]);
      }else{
        current = remainder;
      }
    }

    if(current !== 0){
      lines.push(spaceBefore + "餘數：" + current);
    }else{
      lines.push(spaceBefore + "沒有餘數");
    }

    return lines.join('\n');
  }

  function showSolution(p){
    if(p.op === '×'){
      return showMulSolution(p);
    }else{
      return showDivSolution(p);
    }
  }

  function renderProblems(){
    problemsDiv.innerHTML = '';
    const mobile = mobileLayoutCheckbox.checked;
    problems.forEach((p,i) => {
      const div = document.createElement('div');
      div.className = 'problem';
      if(mobile) div.style.gridColumn = 'span 5';

      div.innerHTML = `
        <div><b>題目${i+1}:</b> ${p.a} ${p.op} ${p.b} = </div>
        <input type="number" class="answer" data-index="${i}" autocomplete="off" inputmode="numeric" style="ime-mode: disabled;" />
        <textarea class="solution" readonly style="display:none;"></textarea>
      `;
      problemsDiv.appendChild(div);
    });
  }

  function startTimer(){
    if(timer) clearInterval(timer);
    const n = problems.length;
    timeLeft = n * timePerQuestion;
    timerSpan.textContent = `倒數計時: ${timeLeft} 秒`;

    timer = setInterval(() => {
      timeLeft--;
      timerSpan.textContent = `倒數計時: ${timeLeft} 秒`;
      if(timeLeft <= 0){
        clearInterval(timer);
        timerSpan.textContent = '時間到！請交卷';
      }
    },1000);
  }

  startBtn.addEventListener('click', () => {
    let n = parseInt(numQuestionsInput.value);
    if(isNaN(n) || n < 1) n = 1;
    if(n > 30) n = 30;

    let mode = 'mul';
    for(const r of modeRadios){
      if(r.checked){
        mode = r.value;
        break;
      }
    }

    problems = [];
    for(let i=0; i<n; i++){
      if(mode === 'mul'){
        problems.push(generateMulProblem());
      }else{
        problems.push(generateDivProblem());
      }
    }

    renderProblems();
    submitBtn.disabled = false;
    scoreDiv.textContent = '';
    startTimer();

    // 預設聚焦第一題輸入框
    setTimeout(() => {
      const firstInput = document.querySelector('input.answer');
      if(firstInput) firstInput.focus();
    }, 100);
  });

  submitBtn.addEventListener('click', () => {
    if(timer) clearInterval(timer);
    timerSpan.textContent = '已交卷';

    const inputs = document.querySelectorAll('input.answer');
    let correctCount = 0;

    inputs.forEach((input,i) => {
      const val = input.value.trim();
      const p = problems[i];
      if(val === p.result.toString()){
        correctCount++;
      }
      const parent = input.parentElement;
      const solutionArea = parent.querySelector('textarea.solution');
      solutionArea.style.display = 'block';
      solutionArea.value = showSolution(p);

      input.disabled = true;
    });

    scoreDiv.textContent = `答對 ${correctCount} 題 / 總共 ${problems.length} 題`;
    submitBtn.disabled = true;
  });

  mobileLayoutCheckbox.addEventListener('change', () => {
    renderProblems();
  });

})();
</script>

</body>
</html>
