<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乘法與除法練習</title>
  <style>
    body { font-family: monospace; padding: 10px; background: #f9f9f9; }
    label { margin-right: 10px; }
    #controls { margin-bottom: 10px; }
    #problems { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .problem { background: white; padding: 8px; border-radius: 5px; border: 1px solid #ccc; white-space: pre-wrap; }
    textarea.solution {
      width: 100%;
      font-family: monospace;
      white-space: pre-wrap;
      margin-top: 4px;
      background: #eef6ff;
      border: 1px solid #99c;
      resize: none;
      overflow: visible;
      height: auto;
      min-height: 200px;
    }
    input.answer {
      width: 100%;
      font-size: 16px;
      box-sizing: border-box;
      margin-top: 6px;
      -moz-appearance: textfield;
    }
    input.answer::-webkit-outer-spin-button,
    input.answer::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    button { margin-top: 10px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
    #timer { font-weight: bold; margin-left: 10px; }
    #score { font-weight: bold; margin-top: 4px; font-size: 18px; white-space: pre; }
    #mobileLayoutLabel { user-select: none; }
  </style>
</head>
<body>

<h1>乘法與除法計算練習</h1>

<div id="controls">
  <label>題數(1~30): <input type="number" id="numQuestions" value="10" min="1" max="30" style="width: 60px;"></label>
  <label><input type="checkbox" id="mobileLayout"> 手機排版(一題一行)</label>
  <label><input type="radio" name="mode" value="mul" checked> 乘法模式</label>
  <label><input type="radio" name="mode" value="div"> 除法模式</label>
  <label><input type="checkbox" id="randomCheckbox" checked> 隨機出題</label>
  <label>試卷編號: <input type="number" id="seedInput" value="1234" style="width: 80px;" disabled></label>
  <button id="startBtn">開始練習</button>
  <span id="timer"></span>
</div>

<div id="problems"></div>

<button id="submitBtn" disabled>交卷</button>

<div id="score"></div>

<script>
(() => {
  const numQuestionsInput = document.getElementById('numQuestions');
  const mobileLayoutCheckbox = document.getElementById('mobileLayout');
  const problemsDiv = document.getElementById('problems');
  const startBtn = document.getElementById('startBtn');
  const submitBtn = document.getElementById('submitBtn');
  const timerSpan = document.getElementById('timer');
  const scoreDiv = document.getElementById('score');
  const modeRadios = document.getElementsByName('mode');
  const randomCheckbox = document.getElementById('randomCheckbox');
  const seedInput = document.getElementById('seedInput');

  let problems = [];
  let timer = null;
  let timeLeft = 0;
  let timePerQuestion = 30;
  const beep = new Audio("data:audio/wav;base64,//uQRAAAAWMSLwUIYAAsYkXgoQwAEaYLWfkWgAI0wWs/ItAAAGDgYtAgAyN+QWaAAihwMWm4G8QQRDiMcCBcH3Cc+CDv/7xA4Tvh9Rz/y8QADBwMWgQAZG/ILNAARQ4GLTcDeIIIhxGOBAuD7hOfBB3/94gcJ3w+o5/5eIAIAAAVwWgQAVQ2ORaIQwEMAJiDg95G4nQL7mQVWI6GwRcfsZAcsKkJvxgxEjzFUgfHoSQ9Qq7KNwqHwuB13MA4a1q/DmBrHgPcmjiGoh//EwC5nGPEmS4RcfkVKOhJf+WOgoxJclFz3kgn//dBA+ya1GhurNn8zb//9NNutNuhz31f////9vt///z+IdAEAAAK4LQIAKobHItEIYCGAExBwe8jcToF9zIKrEdDYIuP2MgOWFSE34wYiR5iqQPj0JIeoVdlG4VD4XA67mAcNa1fhzA1jwHuTRxDUQ//iYBczjHiTJcIuPyKlHQkv/LHQUYkuSi57yQT//uggfZNajQ3Vmz+ Zt//+mm3Wm3Q576v////+32///5/EOgAAADVghQAAAAA//uQZAUAB1WI0PZugAAAAAoQwAAAEk3nRd2qAAAAACiDgAAAAAAABCqEEQRLCgwpBGMlJkIz8jKhGvj4k6jzRnqasNKIeoh5gI7BJaC1A1AoNBjJgbyApVS4IDlZgDU5WUAxEKDNmmALHzZp0Fkz1FMTmGFl1FMEyodIavcCAUHDWrKAIA4aa2oCgILEBupZgHvAhEBcZ6joQBxS76AgccrFlczBvKLC0QI2cBoCFvfTDAo7eoOQInqDPBtvrDEZBNYN5xwNwxQRfw8ZQ5wQVLvO8OYU+mHvFLlDh05Mdg7BT6YrRPpCBznMB2r//xKJjyyOh+cImr2/4doscwD6neZjuZR4AgAABYAAAABy1xcdQtxYBYYZdifkUDgzzXaXn98Z0oi9ILU5mBjFANmRwlVJ3/6jYDAmxaiDG3/6xjQQCCKkRb/6kg/wW+kSJ5//rLobkLSiKmqP/0ikJuDaSaSf/6JiLYLEYnW/+kXg1WRVJL/9EmQ1YZIsv/6Qzwy5qk7/+tEU0nkls3/zIUMPKNX/6yZLf+kFgAfgGyLFAUwY//uQZAUABcd5UiNPVXAAAApAAAAAE0VZQKw9ISAAACgAAAAAVQIygIElVrFkBS+Jhi+EAuu+lKAkYUEIsmEAEoMeDmCETMvfSHTGkF5RWH7kz/ESHWPAq/kcCRhqBtMdokPdM7vil7RG98A2sc7zO6ZvTdM7pmOUAZTnJW+NXxqmd41dqJ6mLTXxrPpnV8avaIf5SvL7pndPvPpndJR9Kuu8fePvuiuhorgWjp7Mf/PRjxcFCPDkW31srioCExivv9lcwKEaHsf/7ow2Fl1T/9RkXgEhYElAoCLFtMArxwivDJJ+bR1HTKJdlEoTELCIqgEwVGSQ+hIm0NbK8WXcTEI0UPoa2NbG4y2K00JEWbZavJXkYaqo9CRHS55FcZTjKEk3NKoCYUnSQ 0rWxrZbFKbKIhOKPZe1cJKzZSaQrIyULHDZmV5K4xySsDRKWOruanGtjLJXFEmwaIbDLX0hIPBUQPVFVkQkDoUNfSoDgQGKPekoxeGzA4DUvnn4bxzcZrtJyipKfPNy5w+9lnXwgqsiyHNeSVpemw4bWb9psYeq//uQZBoABQt4yMVxYAIAAAkQoAAAHvYpL5m6AAgAACXDAAAAD59jblTirQe9upFsmZbpMudy7Lz1X1DYsxOOSWpfPqNX2WqktK0DMvuGwlbNj44TleLPQ+Gsfb+GOWOKJoIrWb3cIMeeON6lz2umTqMXV8Mj30yWPpjoSa9ujK8SyeJP5y5mOW1D6hvLepeveEAEDo0mgCRClOEgANv3B9a6fikgUSu/DmAMATrGx7nng5p5iimPNZsfQLYB2sDLIkzRKZOHGAaUyDcpFBSLG9MCQA ZGUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMjAwNGh0dHA6Ly93d3cuc291bmRib3kuZGUAAAAAAAAAACU=");

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function seededRandom(seed) {
    let x = Math.sin(seed.value++) * 10000;
    return x - Math.floor(x);
  }

  function seededRandInt(seed, min, max) {
    return Math.floor(seededRandom(seed) * (max - min + 1)) + min;
  }

  function generateMulProblem(seed = null) {
    const rand = seed ? (min, max) => seededRandInt(seed, min, max) : randInt;
    const digitsA = rand(2, 3);
    const digitsB = rand(2, 3);
    const a = rand(10 ** (digitsA - 1), 10 ** digitsA - 1);
    const b = rand(10 ** (digitsB - 1), 10 ** digitsB - 1);
    return { a, b, op: '×', result: a * b };
  }

  function generateDivProblem(seed = null) {
    const rand = seed ? (min, max) => seededRandInt(seed, min, max) : randInt;
    const divisor = rand(10, 99);
    const maxQuotient = Math.floor(9999 / divisor);
    const quotient = rand(10, maxQuotient);
    const dividend = divisor * quotient;
    return { a: dividend, b: divisor, op: '÷', result: quotient };
  }

  function padLeft(str, len) {
    return ' '.repeat(len - str.length) + str;
  }

  function showMulSolution(p) {
    const a = p.a.toString();
    const b = p.b.toString();
    const resultStr = p.result.toString();
    const bDigits = b.split('').reverse();
    let partials = [];
    for (let i = 0; i < bDigits.length; i++) {
      const digit = parseInt(bDigits[i]);
      const partial = (p.a * digit).toString();
      partials.push(padLeft(partial + ' '.repeat(i), resultStr.length));
    }
    const width = Math.max(a.length, b.length + 1, resultStr.length);
    let lines = [];
    lines.push(padLeft(a, width));
    lines.push('×' + padLeft(b, width - 1));
    lines.push('-'.repeat(width));
    partials.forEach(line => lines.push(line));
    if (partials.length > 1) {
      lines.push('-'.repeat(width));
      lines.push(padLeft(resultStr, width));
    }
    return lines.join('\n');
  }

  function showDivSolution(p) {
    const dividend = p.a.toString();
    const divisor = p.b.toString();
    const quotient = p.result.toString();
    const divisorLen = divisor.length;
    const dividendLen = dividend.length;
    const spaceBefore = ' '.repeat(divisorLen + 1);
    const firstLine = spaceBefore + quotient;
    const secondLine = divisor + ')' + dividend;
    let lines = [firstLine, secondLine];
    let idx = 0;
    let current = parseInt(dividend[idx]);
    while (current < p.b && idx < dividend.length - 1) {
      idx++;
      current = current * 10 + parseInt(dividend[idx]);
    }
    const lineLen = divisorLen + dividendLen;
    while (idx < dividend.length) {
      const qDigit = Math.floor(current / p.b);
      const mult = qDigit * p.b;
      const remainder = current - mult;
      const spaceCount = lineLen - (dividend.length - idx);
      const currentStr = padLeft(current.toString(), spaceCount);
      const multStr = padLeft(mult.toString(), spaceCount);
      const dashStr = padLeft('-'.repeat(mult.toString().length), spaceCount);
      lines.push(currentStr, multStr, dashStr);
      idx++;
      current = idx < dividend.length ? remainder * 10 + parseInt(dividend[idx]) : remainder;
    }
    lines.push(spaceBefore + (current !== 0 ? "餘數：" + current : "沒有餘數"));
    return lines.join('\n');
  }

  function showSolution(p) {
    return p.op === '×' ? showMulSolution(p) : showDivSolution(p);
  }

  function renderProblems() {
    problemsDiv.innerHTML = '';
    const mobile = mobileLayoutCheckbox.checked;
    problems.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'problem';
      if (mobile) div.style.gridColumn = 'span 5';
      div.innerHTML = `
        <div><b>題目${i + 1}:</b> ${p.a} ${p.op} ${p.b} = </div>
        <input type="number" class="answer" data-index="${i}" autocomplete="off" inputmode="numeric" />
        <textarea class="solution" readonly style="display:none;"></textarea>
      `;
      problemsDiv.appendChild(div);
    });
  }

function autoSubmit() {
  if (timer) clearInterval(timer);

  const inputs = document.querySelectorAll('input.answer');
  let correctCount = 0;

  inputs.forEach((input, i) => {
    const val = input.value.trim();
    const p = problems[i];
    const parent = input.parentElement;
    const solutionArea = parent.querySelector('textarea.solution');

    if (val === p.result.toString()) {
      correctCount++;
      parent.style.backgroundColor = "";
    } else {
      parent.style.backgroundColor = "#fdd";
    }

    solutionArea.style.display = 'block';
    solutionArea.value = showSolution(p);
    input.disabled = true;
  });

  // ✅ 結果計算完後再輸出
  timerSpan.innerHTML = `已交卷<br>答對 ${correctCount} 題 / 總共 ${problems.length} 題`;
  scoreDiv.textContent = ''; // 這行不一定需要，但保持乾淨
  submitBtn.disabled = true;
}


  function startTimer() {
    if (timer) clearInterval(timer);
    const n = problems.length;
    timeLeft = n * timePerQuestion;
    timerSpan.textContent = `倒數計時: ${timeLeft} 秒\n`;
    timer = setInterval(() => {
      timeLeft--;
      timerSpan.textContent = `倒數計時: ${timeLeft} 秒`;
      if (timeLeft === 10) {
        let halfSeconds = 0;
        beep.play().catch(() => {});
        beepHalfSecondInterval = setInterval(() => {
          beep.currentTime = 0;
          beep.play().catch(() => {});
          halfSeconds++;
          if (halfSeconds >= 20) {
            clearInterval(beepHalfSecondInterval);
          }
        }, 500);
      }  
      if (timeLeft <= 0) {
        clearInterval(timer);
        timerSpan.textContent = '時間到！自動交卷';
        autoSubmit();
      }
    }, 1000);
  }

  startBtn.addEventListener('click', () => {
    let n = parseInt(numQuestionsInput.value);
    if (isNaN(n) || n < 1) n = 1;
    if (n > 30) n = 30;

    let mode = 'mul';
    for (const r of modeRadios) {
      if (r.checked) {
        mode = r.value;
        break;
      }
    }

    timePerQuestion = mode === 'mul' ? 30 : 45;

    problems = [];
    const useSeed = !randomCheckbox.checked;
    let seed = null;
    if (useSeed) {
      seed = { value: parseInt(seedInput.value) || 0 };
    }
    for (let i = 0; i < n; i++) {
      problems.push(mode === 'mul' ? generateMulProblem(seed) : generateDivProblem(seed));
    }

    renderProblems();
    submitBtn.disabled = false;
    scoreDiv.textContent = '';
    startTimer();
    setTimeout(() => {
      const firstInput = document.querySelector('input.answer');
      if (firstInput) firstInput.focus();
    }, 100);
  });

  submitBtn.addEventListener('click', autoSubmit);
  mobileLayoutCheckbox.addEventListener('change', renderProblems);
  randomCheckbox.addEventListener('change', () => {
    seedInput.disabled = randomCheckbox.checked;
  });
})();
</script>

</body>
</html>
