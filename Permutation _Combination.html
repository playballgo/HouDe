<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排列與組合動畫示範</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }
        h1 { color: #2c3e50; margin-bottom: 5px;}
        .container {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto;
        }
        .problem-desc {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f9f9f9;
            border-left: 5px solid #3498db;
            text-align: left;
        }
        .controls {
            margin: 20px 0;
            padding: 15px;
            background-color: #e8f4f8;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls label {
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
        }
        .controls input[type="number"] {
            width: 60px;
            padding: 5px;
            font-size: 1.1em;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .controls input[type="checkbox"] {
            transform: scale(1.5);
            margin-right: 8px;
            cursor: pointer;
        }
        .checkbox-container {
            background-color: #fff3cd;
            padding: 8px 15px;
            border-radius: 8px;
            border: 2px dashed #ffc107;
        }
        .chairs-container {
            position: relative;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px 0;
            min-height: 120px;
        }
        .chair {
            width: 75px;
            height: 95px;
            background-color: #e0b0ff;
            border: 3px solid #8a2be2;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.5s;
        }
        .chair-number {
            background-color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            margin-top: 5px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #333;
        }
        .floating-person {
            position: absolute;
            width: 75px;
            height: 60px;
            font-size: 20px;
            font-weight: bold;
            color: #d35400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px dashed #d35400;
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            left: 50%;
            top: -80px;
            transform: translateX(-50%); 
        }
        .seated-person {
            margin-top: 5px;
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
            text-align: center;
            line-height: 1.2;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .explanation {
            font-size: 1.3em;
            margin: 20px 0;
            min-height: 70px;
            color: #c0392b;
            font-weight: bold;
            background: #fdf2e9;
            padding: 10px;
            border-radius: 8px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn:hover { background-color: #2980b9; }
        .btn:disabled { background-color: #95a5a6; cursor: not-allowed; box-shadow: none; }
        #listBtn { background-color: #27ae60; }
        #listBtn:hover { background-color: #2ecc71; }
        
        .results-box {
            margin-top: 30px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            max-height: 350px;
            overflow-y: auto;
            text-align: left;
            display: none;
        }
        .combination-item {
            padding: 8px;
            border-bottom: 1px dashed #ccc;
        }
        .combination-item:last-child { border-bottom: none; }
        
        /* 組合模式下的統一視覺效果 */
        .combo-selected {
            color: white !important;
            font-size: 24px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="mainTitle">🪑 排列動畫：選椅子遊戲</h1>
    
    <div class="problem-desc" id="mainDesc">
        題目加載中...
    </div>
    
    <div class="controls">
        <label>椅子數量 (N): <input type="number" id="nChairs" value="7" min="1" max="12" onchange="updateMode()"></label>
        <label>人數/選取數 (K): <input type="number" id="kPeople" value="3" min="1" max="12" onchange="updateMode()"></label>
        
        <label class="checkbox-container">
            <input type="checkbox" id="isCombo" onchange="updateMode()"> 
            改成「組合」(不區分誰坐哪裡)
        </label>
        
        <button class="btn" onclick="initSetup()" id="setupBtn">🔄 更新畫面</button>
    </div>

    <div class="chairs-container" id="chairs">
        <!-- 椅子會由 JavaScript 動態產生 -->
    </div>

    <div class="explanation" id="explanationText">
        請點擊「看動畫示範」開始！
    </div>

    <button class="btn" id="animBtn" onclick="playAnimation()">🎬 看動畫示範一次</button>
    <button class="btn" id="listBtn" onclick="listAllCombinations()">📝 列出所有結果</button>

    <div class="results-box" id="resultsBox"></div>
</div>

<script>
    let isAnimating = false;
    const sleep = ms => new Promise(res => setTimeout(res, ms));

    window.onload = function() {
        updateMode();
        initSetup();
    };

    function updateMode() {
        let isCombo = document.getElementById('isCombo').checked;
        let n = parseInt(document.getElementById('nChairs').value) || 7;
        let k = parseInt(document.getElementById('kPeople').value) || 3;
        
        if (k > n) k = n; // 防呆
        
        let titleEl = document.getElementById('mainTitle');
        let descEl = document.getElementById('mainDesc');
        
        if (isCombo) {
            titleEl.innerHTML = `🪑 組合動畫：選出 ${k} 張椅子`;
            descEl.innerHTML = `<strong>【組合問題】</strong> 有 ${n} 張椅子，我們要從中選出 ${k} 張（例如選出來貼上標籤）。<br>因為只看「哪幾張被選中」，<strong>不區分順序（A椅子和B椅子誰先被選都沒差）</strong>，總共有幾種可能？`;
            document.getElementById('animBtn').innerText = "🎬 看組合動畫示範";
        } else {
            titleEl.innerHTML = `🪑 排列動畫：${k} 個人坐椅子`;
            descEl.innerHTML = `<strong>【排列問題】</strong> 有 ${n} 張椅子，${k} 個人去坐。<br>因為「1號人坐A椅子」和「2號人坐A椅子」是完全不同的情況，<strong>區分誰坐哪一張（有順序之分）</strong>，總共有幾種可能？`;
            document.getElementById('animBtn').innerText = "🎬 看排列動畫示範";
        }
        
        document.getElementById('resultsBox').style.display = 'none';
        
        // 如果不在動畫中，順便更新畫面配置
        if (!isAnimating) {
            renderChairs(n);
        }
    }

    function initSetup() {
        if (isAnimating) return;
        
        let n = parseInt(document.getElementById('nChairs').value);
        let k = parseInt(document.getElementById('kPeople').value);
        
        if (isNaN(n) || n < 1) n = 1;
        if (n > 12) n = 12; 
        if (isNaN(k) || k < 1) k = 1;
        if (k > n) {
            alert('選取的數量不能超過椅子總數喔！已自動幫您調整。');
            k = n;
        }
        
        document.getElementById('nChairs').value = n;
        document.getElementById('kPeople').value = k;
        
        updateMode();
        renderChairs(n);
        document.getElementById('explanationText').innerText = `設定完成！點擊下方按鈕開始。`;
    }

    function renderChairs(n) {
        const chairsContainer = document.getElementById('chairs');
        chairsContainer.innerHTML = ''; 
        
        for (let i = 1; i <= n; i++) {
            const chairDiv = document.createElement('div');
            chairDiv.className = 'chair';
            chairDiv.id = `chair-${i}`;
            
            const numDiv = document.createElement('div');
            numDiv.className = 'chair-number';
            numDiv.innerText = i;
            
            chairDiv.appendChild(numDiv);
            chairsContainer.appendChild(chairDiv);
        }
    }

    async function playAnimation() {
        if (isAnimating) return;
        isAnimating = true;
        
        document.getElementById('animBtn').disabled = true;
        document.getElementById('setupBtn').disabled = true;
        document.getElementById('listBtn').disabled = true;

        const n = parseInt(document.getElementById('nChairs').value);
        const k = parseInt(document.getElementById('kPeople').value);
        const isCombo = document.getElementById('isCombo').checked;
        
        renderChairs(n);
        
        const chairsContainer = document.getElementById('chairs');
        let emptyChairs = Array.from({length: n}, (_, i) => i + 1);
        
        // 隨機選出 K 張椅子作為最終選擇
        let finalChoices = [];
        let tempEmpty = [...emptyChairs];
        for (let i = 0; i < k; i++) {
            let idx = Math.floor(Math.random() * tempEmpty.length);
            finalChoices.push(tempEmpty.splice(idx, 1)[0]);
        }

        // ==========================
        // 階段 1：完成「排列」的動作
        // ==========================
        for (let p = 1; p <= k; p++) {
            let labelText = isCombo ? `第 ${p} 次選取` : `${p}號人`;
            document.getElementById('explanationText').innerHTML = `現在進行 <strong>${labelText}</strong> ... (剩餘 ${emptyChairs.length} 個選擇)`;
            
            let personDiv = document.createElement('div');
            personDiv.className = 'floating-person';
            personDiv.innerHTML = isCombo ? `🏷️<br>標籤${p}` : `👤<br>${p}號`;
            chairsContainer.appendChild(personDiv);
            
            await sleep(100);
            personDiv.style.transform = 'none';
            
            let targetChairNum = finalChoices[p-1];
            
            // 猶豫跳躍
            let hops = Math.min(3, emptyChairs.length);
            for (let h = 0; h < hops; h++) {
                let hoverIdx = Math.floor(Math.random() * emptyChairs.length);
                let hoverChairNum = emptyChairs[hoverIdx];
                let chairEl = document.getElementById(`chair-${hoverChairNum}`);
                personDiv.style.left = chairEl.offsetLeft + 'px';
                personDiv.style.top = (chairEl.offsetTop - 40) + 'px';
                await sleep(500);
            }
            
            // 坐下/貼上標籤
            let finalChairEl = document.getElementById(`chair-${targetChairNum}`);
            personDiv.style.left = finalChairEl.offsetLeft + 'px';
            personDiv.style.top = (finalChairEl.offsetTop - 15) + 'px';
            document.getElementById('explanationText').innerHTML = `決定選擇 <strong>${targetChairNum}號椅子</strong>！`;
            
            await sleep(500);
            personDiv.remove();
            let emoji = isCombo ? '🏷️' : '👤';
            let name = isCombo ? `標籤${p}` : `${p}號`;
            finalChairEl.innerHTML += `<div class="seated-person">${emoji} ${name}</div>`;
            
            emptyChairs = emptyChairs.filter(c => c !== targetChairNum);
            await sleep(600);
        }
        
        // 算出排列數 (P)
        let totalPermutations = 1;
        let pCalcStr = [];
        for (let i = 0; i < k; i++) {
            totalPermutations *= (n - i);
            pCalcStr.push(n - i);
        }

        // ==========================
        // 階段 2：如果是組合，加上互換動畫
        // ==========================
        if (isCombo) {
            document.getElementById('explanationText').innerHTML = `因為是<strong>「組合」</strong>，不區分先後順序。<br>現在我們讓這些標籤互相交換看看...`;
            await sleep(2000);
            
            // 計算階乘 K!
            let kFact = 1;
            for(let i=1; i<=k; i++) kFact *= i;
            
            // 準備互換陣列
            let currentItems = Array.from({length: k}, (_, i) => i + 1);
            
            // 示範互換幾次
            let swaps = Math.min(3, kFact - 1); 
            if (k > 1 && swaps > 0) {
                for (let s = 0; s < swaps; s++) {
                    // 把陣列往後移一位，製造位移感
                    currentItems.push(currentItems.shift()); 
                    
                    for (let i = 0; i < k; i++) {
                        let chairEl = document.getElementById(`chair-${finalChoices[i]}`);
                        let seatedEl = chairEl.querySelector('.seated-person');
                        seatedEl.innerHTML = `🏷️ 標籤${currentItems[i]}`;
                        // 重新觸發動畫
                        seatedEl.style.animation = 'none';
                        void seatedEl.offsetWidth; 
                        seatedEl.style.animation = 'popIn 0.3s ease-out';
                    }
                    await sleep(1000);
                }
            }

            document.getElementById('explanationText').innerHTML = `你看！這 ${kFact} 種不同的貼法（排列），其實都是<strong>選到同一組椅子！</strong>`;
            await sleep(2500);

            // 統一樣式，顯示為同一個結果
            for (let i = 0; i < k; i++) {
                let chairEl = document.getElementById(`chair-${finalChoices[i]}`);
                chairEl.style.backgroundColor = '#f1c40f'; // 變金色
                chairEl.style.borderColor = '#d35400';
                let seatedEl = chairEl.querySelector('.seated-person');
                seatedEl.innerHTML = `✔️<br>已選`;
                seatedEl.classList.add('combo-selected');
            }
            
            document.getElementById('explanationText').innerHTML = 
                `🎉 組合完成！<br>
                排列總數(${totalPermutations}) ÷ 內部換位子(${kFact}種) = <strong>${totalPermutations / kFact}</strong> 種組合！`;

        } else {
            // 排列模式的結語
            document.getElementById('explanationText').innerHTML = 
                `🎉 全部坐好了！<br>
                這是「排列」，總共有： ${pCalcStr.join(' × ')} = <strong>${totalPermutations}</strong> 種可能！`;
        }
        
        isAnimating = false;
        document.getElementById('animBtn').disabled = false;
        document.getElementById('setupBtn').disabled = false;
        document.getElementById('listBtn').disabled = false;
    }

    function listAllCombinations() {
        const n = parseInt(document.getElementById('nChairs').value);
        const k = parseInt(document.getElementById('kPeople').value);
        const isCombo = document.getElementById('isCombo').checked;
        const resultsBox = document.getElementById('resultsBox');
        
        resultsBox.style.display = 'block';
        resultsBox.innerHTML = `<h3>計算中...</h3>`;
        
        setTimeout(() => {
            let chairs = Array.from({length: n}, (_, i) => i + 1);
            let results = [];
            let maxDisplay = 1000;
            
            if (isCombo) {
                // 產生組合 (Combinations)
                function combine(start, currentArr) {
                    if (results.length >= maxDisplay) return;
                    if (currentArr.length === k) {
                        results.push([...currentArr]);
                        return;
                    }
                    for (let i = start; i < chairs.length; i++) {
                        if (results.length >= maxDisplay) return;
                        currentArr.push(chairs[i]);
                        combine(i + 1, currentArr);
                        currentArr.pop();
                    }
                }
                combine(0, []);
                
                // 計算總組合數 C(n,k)
                let cTotal = 1;
                for(let i=0; i<k; i++) {
                    cTotal = cTotal * (n - i) / (i + 1);
                }
                
                let htmlContent = `<h3>總共 ${cTotal} 種組合 (不分順序)：</h3>`;
                if (cTotal > maxDisplay) {
                    htmlContent += `<p style="color:red; font-weight:bold;">(結果太多了！此處僅顯示前 ${maxDisplay} 種)</p>`;
                }
                
                for (let i = 0; i < results.length; i++) {
                    let text = `選了 <strong>${results[i].join('號、')}號</strong> 椅子`;
                    htmlContent += `<div class="combination-item">第 ${i + 1} 種： ${text}</div>`;
                }
                resultsBox.innerHTML = htmlContent;

            } else {
                // 產生排列 (Permutations)
                function permute(available, currentArr) {
                    if (results.length >= maxDisplay) return;
                    if (currentArr.length === k) {
                        results.push([...currentArr]);
                        return;
                    }
                    for (let i = 0; i < available.length; i++) {
                        if (results.length >= maxDisplay) return;
                        let nextAvailable = available.slice();
                        let chosen = nextAvailable.splice(i, 1)[0];
                        currentArr.push(chosen);
                        permute(nextAvailable, currentArr);
                        currentArr.pop();
                    }
                }
                permute(chairs, []);
                
                let pTotal = 1;
                for(let i=0; i<k; i++) pTotal *= (n-i);
                
                let htmlContent = `<h3>總共 ${pTotal} 種排列 (區分誰坐哪裡)：</h3>`;
                if (pTotal > maxDisplay) {
                    htmlContent += `<p style="color:red; font-weight:bold;">(結果太多了！此處僅顯示前 ${maxDisplay} 種)</p>`;
                }
                
                for (let i = 0; i < results.length; i++) {
                    let textArr = results[i].map((chairNum, idx) => `<strong>${idx + 1}號人</strong>坐<strong>${chairNum}號</strong>`);
                    htmlContent += `<div class="combination-item">第 ${i + 1} 種： ${textArr.join(' , ')}</div>`;
                }
                resultsBox.innerHTML = htmlContent;
            }
        }, 100);
    }
</script>

</body>
</html>
