<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>桌球得分模擬器（五戰三勝）</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef7ff; padding: 2rem; }
    h1 { text-align: center; }
    .scoreboards { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
    .scoreboard-group { background: #ffffffcc; border-radius: 1rem; box-shadow: 0 0 10px rgba(0,0,0,0.1); padding: 0.5rem; }
    .scoreboard-group.deuce { background: #000; color: green; }	
    .scoreboard { display: flex; justify-content: center; gap: 1rem; }
    .player { background: #fff; padding: 20; border-radius: 1rem; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; width: 100px; font-size: 0.7rem}
    .player.winner { background: #007BFF; color: white; }
	.player.b-winner { background: #dc3545; color: white; }
    .score { font-size: 1.25rem; margin-top: 0.5rem; }
    .controls { text-align: center; margin-top: 2rem; }
    .log { max-height: 300px; overflow-y: auto; background: white; border-radius: 0.5rem; padding: 1rem; margin: 2rem auto; width: 90%; box-shadow: 0 0 5px rgba(0,0,0,0.1); font-family: monospace; white-space: pre-wrap; }
    .log strong { font-weight: bold; }
    button { padding: 0.5rem 1.5rem; font-size: 1rem; margin: 0.5rem; border: none; border-radius: 0.5rem; background: #4CAF50; color: white; cursor: pointer; }
    input[type="number"] { width: 60px; text-align: center; margin: 0 0.5rem; }
    .game-title { text-align: center; font-weight: bold; width: 100%; margin-bottom: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>桌球得分模擬器</h1>
  <div class="scoreboards" id="scoreboards"></div>
  <div class="status" id="statusDisplay" style="text-align:center; font-size: 1.2rem; margin-bottom: 1rem;">第 1 局，第 1 分</div>
  <div class="controls">
    <label>選手 A 戰鬥力(基本功x平均質量)：<input type="number" id="playerAForce" value="100" min="0" step="1" oninput="updateRatesFromForce()" /></label>
    <label>發球優勢 (%): <input type="number" id="advantageA" value="15"></label><br>
    <label>狀況好機率 (%): <input type="number" id="goodProbA" value="40"></label>
    <label>狀況好加成 (%): <input type="number" id="goodBonusA" value="10"></label><br>
    <label>狀況壞機率 (%): <input type="number" id="badProbA" value="10"></label>
    <label>狀況壞降低 (%): <input type="number" id="badPenaltyA" value="40"></label><br><br>
	<br>
    <label>選手 B 戰鬥力(基本功x平均質量)：<input type="number" id="playerBForce" value="90" min="0" step="1" oninput="updateRatesFromForce()" /></label>
    <label>發球優勢 (%): <input type="number" id="advantageB" value="5"></label><br>
    <label>狀況好機率 (%): <input type="number" id="goodProbB" value="20"></label>
    <label>狀況好加成 (%): <input type="number" id="goodBonusB" value="30"></label><br>
    <label>狀況壞機率 (%): <input type="number" id="badProbB" value="30"></label>
    <label>狀況壞降低 (%): <input type="number" id="badPenaltyB" value="50"></label><br><br>

    <input type="hidden" id="rateA" value="50" />
    <input type="hidden" id="rateB" value="50" />

    <button id="simulateBtn">開始模擬五戰三勝</button>
    <button id="resetBtn">重置</button>

<div>
  <strong>選手 A 戰鬥力平均得分率：</strong><span id="qualityRate">0</span>
</div>
<script>
  
  function updateRatesFromForce() {
    const a = parseFloat(document.getElementById("playerAForce").value) || 0;
    const b = parseFloat(document.getElementById("playerBForce").value) || 0;
    const total = a + b;
    const rateA = total === 0 ? 50 : (a / total) * 100;
    const rateB = total === 0 ? 50 : (b / total) * 100;
    document.getElementById("rateA").value = rateA.toFixed(2);
    document.getElementById("rateB").value = rateB.toFixed(2);
    updateQualityRate();
  }

function updateQualityRate() {
    const a = parseFloat(document.getElementById("playerAForce").value) || 0;
    const b = parseFloat(document.getElementById("playerBForce").value) || 0;
    const rate = (a + b === 0) ? 0.5 : a / (a + b);
    document.getElementById("qualityRate").textContent = (rate * 100).toFixed(1) + "%";
  }
  updateQualityRate();
</script>

	* 選手 A 勝率若大於 "隨機勝敗"，模擬結果為選手 A 勝
  </div>

  <div class="log" id="log"></div>

  <script>
    let gameCountA = 0, gameCountB = 0, scoreA = 0, scoreB = 0, pointNumber = 1;

    let goodCountA = 0, badCountA = 0, goodCountB = 0, badCountB = 0; serveWinA = 0, serveWinB = 0;

    let scoreboardContainer;

    function createScoreboard(gameNum) {
      const group = document.createElement('div');
      group.className = 'scoreboard-group';
      group.innerHTML = '<div class="game-title">第 ' + gameNum + ' 局</div>' +
        '<div class="scoreboard">' +
        '<div class="player" id="playerA' + gameNum + '"><h2>選手 A</h2><div class="score" id="scoreA' + gameNum + '">0</div></div>' +
        '<div class="player" id="playerB' + gameNum + '"><h2>選手 B</h2><div class="score" id="scoreB' + gameNum + '">0</div></div>' +
        '</div>';
      scoreboardContainer.appendChild(group);
    }

    function updateScores(gameNum) {
      document.getElementById(`scoreA${gameNum}`).textContent = scoreA;
      document.getElementById(`scoreB${gameNum}`).textContent = scoreB;
    }

    function updateStatusDisplay(gameNumber, pointNumber) {
      document.getElementById('statusDisplay').textContent = `第 ${gameNumber} 局，第 ${pointNumber} 分`;
    }

    function reset() {
      gameCountA = 0; gameCountB = 0; scoreA = 0; scoreB = 0; pointNumber = 1;

      goodCountA = 0; badCountA = 0; goodCountB = 0; badCountB = 0; serveWinA = 0, serveWinB = 0;

      document.getElementById('log').textContent = '';
      scoreboardContainer = document.getElementById('scoreboards');
      scoreboardContainer.innerHTML = '';
      updateStatusDisplay(1, 1);
    }

    function logPoint(text, isDeuce) {
      const isAWins = text.includes('A 得分');
	  const styledText = isAWins ? `<span style="color:blue">${text}</span>` : text;
      const log = document.getElementById('log');
      log.innerHTML += isDeuce ? `<strong>${styledText}</strong><br>` : `${styledText}<br>`;
      log.scrollTop = log.scrollHeight;
    }

    function getCurrentServer() {
      const total = scoreA + scoreB;
      if ((scoreA >= 10 && scoreB >= 10) && Math.abs(scoreA - scoreB) < 2) return total % 2 === 0 ? 'A' : 'B';
      return Math.floor(total / 2) % 2 === 0 ? 'A' : 'B';
    }

    async function simulatePoint(gameNum) {
      const rateA = +document.getElementById('rateA').value;
      const rateB = +document.getElementById('rateB').value;
      const advA = +document.getElementById('advantageA').value;
      const advB = +document.getElementById('advantageB').value;
      const probGoodA = +document.getElementById('goodProbA').value / 100;
      const bonusGoodA = +document.getElementById('goodBonusA').value;
      const probBadA = +document.getElementById('badProbA').value / 100;
      const penaltyBadA = +document.getElementById('badPenaltyA').value;
      const probGoodB = +document.getElementById('goodProbB').value / 100;
      const bonusGoodB = +document.getElementById('goodBonusB').value;
      const probBadB = +document.getElementById('badProbB').value / 100;
      const penaltyBadB = +document.getElementById('badPenaltyB').value;

      const server = getCurrentServer();
      let conditionNote = "";
      let effectiveRateA = rateA + (server === 'A' ? advA : 0);
      let effectiveRateB = rateB + (server === 'B' ? advB : 0);
      if (Math.random() < probGoodA) { effectiveRateA += bonusGoodA; conditionNote += "A狀況好 "; goodCountA++; }
      else if (Math.random() < probBadA) { effectiveRateA -= penaltyBadA; conditionNote += "A狀況壞 "; badCountA++; }
      if (Math.random() < probGoodB) { effectiveRateB += bonusGoodB; conditionNote += "B狀況好 "; goodCountB++; }
      else if (Math.random() < probBadB) { effectiveRateB -= penaltyBadB; conditionNote += "B狀況壞 "; badCountB++; }

      const total = effectiveRateA + effectiveRateB;
      const normalizedA = effectiveRateA / total;
      const rnd = Math.random();
      const isDeuce = scoreA >= 10 && scoreB >= 10;

      const outcome = rnd < normalizedA ? "A 得分" : "B 得分";
      if (rnd < normalizedA) {
	    scoreA++;
		if (server === 'A') serveWinA++;
      } else {
	    scoreB++;
		if (server === 'B') serveWinB++;		
	  }
      pointNumber++;

      const logEntry = `${gameNum}-${pointNumber - 1} ${server} 發球:綜合勝率 A:${effectiveRateA}% B:${effectiveRateB}%→百分勝率(${(normalizedA * 100).toFixed(1)}% ${(100 - normalizedA * 100).toFixed(1)}%)，隨機勝敗判定 ${rnd.toFixed(2)}→${outcome} ${conditionNote.trim()}`;
      logPoint(logEntry, isDeuce);

      if (isDeuce) {
        document.querySelector(`#scoreboards .scoreboard-group:nth-child(${gameNum})`).classList.add("deuce");
      } else {
        document.querySelector(`#scoreboards .scoreboard-group:nth-child(${gameNum})`).classList.remove("deuce");
      }

      updateScores(gameNum);
      updateStatusDisplay(gameNum, pointNumber);
    }

    async function simulateGame(gameNum) {
      scoreA = 0; scoreB = 0; pointNumber = 1;

      goodCountA = 0; badCountA = 0; goodCountB = 0; badCountB = 0; serveWinA = 0, serveWinB = 0;

      createScoreboard(gameNum);
      updateScores(gameNum);
      updateStatusDisplay(gameNum, pointNumber);
      while (true) {
        await simulatePoint(gameNum);
        await new Promise(r => setTimeout(r, 200));
        if ((scoreA >= 11 || scoreB >= 11) && Math.abs(scoreA - scoreB) >= 2) {
          if (scoreA > scoreB) {
            gameCountA++;
            logPoint(`\n⭐️ A 贏得第 ${gameNum} 局`, false);
            document.getElementById(`playerA${gameNum}`).classList.add('winner');

            const statsA = document.createElement('div');
            statsA.innerHTML = `狀況好 ${goodCountA} 次<br>狀況壞 ${badCountA} 次<BR>發球時得分: ${serveWinA} 次`;
            document.getElementById(`playerA${gameNum}`).appendChild(statsA);

            const statsB = document.createElement('div');
            statsB.innerHTML = `狀況好 ${goodCountB} 次<br>狀況壞 ${badCountB} 次<BR>發球時得分: ${serveWinB} 次`;
            document.getElementById(`playerB${gameNum}`).appendChild(statsB);

          } else {
            gameCountB++;
            logPoint(`\n⭐️ B 贏得第 ${gameNum} 局`, false);
            document.getElementById(`playerB${gameNum}`).classList.add('b-winner');

            const statsA = document.createElement('div');
            statsA.innerHTML = `狀況好 ${goodCountA} 次<br>狀況壞 ${badCountA} 次<BR>發球時得分: ${serveWinA} 次`;
            document.getElementById(`playerA${gameNum}`).appendChild(statsA);

            const statsB = document.createElement('div');
            statsB.innerHTML = `狀況好 ${goodCountB} 次<br>狀況壞 ${badCountB} 次<BR>發球時得分: ${serveWinB} 次`;
            document.getElementById(`playerB${gameNum}`).appendChild(statsB);
          }
          break;
        }
      }
    }

    async function simulateMatch() {
      reset();
      let gameNum = 1;
      while (gameCountA < 3 && gameCountB < 3) {
        await simulateGame(gameNum++);
        await new Promise(r => setTimeout(r, 500));
      }
      logPoint(`\n🏁 比賽結束，${gameCountA === 3 ? 'A' : 'B'} 勝出！`, false);
    }
  </script>
  
  <script>
  function bindButtonEvents(id, handler) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener("click", handler);
    btn.addEventListener("touchstart", function (e) {
      e.preventDefault(); // 防止點兩次
      handler();
    }, { passive: false });
  }

  bindButtonEvents("simulateBtn", simulateMatch);
  bindButtonEvents("resetBtn", reset);
</script>
</body>
</html>
